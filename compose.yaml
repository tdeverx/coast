services:
  coast:
    image: ghcr.io/tdeverx/coast:preview
    build: .
    ports:
      - "3000:3000"
    environment:
      # Change this to the URL users open for LAN or public access.
      ORIGIN: http://localhost:3000
      # Leave blank for bundled PostgreSQL, or set the URL of an existing database.
      DATABASE_URL: ""
    volumes:
      - coast-data:/data
    restart: unless-stopped
    stop_grace_period: 40s
volumes:
  coast-data:
