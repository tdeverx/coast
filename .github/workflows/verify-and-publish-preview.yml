name: Verify and publish preview

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run code:inventory
      - run: bun run code:style
      - run: bun run ui:inventory:check
      - run: bun run check
      - run: bun test
      - run: bun run build

  database:
    name: PostgreSQL ${{ matrix.postgres }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Match the deployed supported major and the development supported major.
        postgres: ['15.19-bookworm', '17.11-bookworm']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: coast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun --bun svelte-kit sync
      - run: bun run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:coast_test@localhost:5432/postgres

  container-smoke:
    name: Disposable container lifecycle
    if: github.event_name == 'pull_request'
    needs: [verify, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build without publishing
        run: docker build --build-arg COAST_BUILD_ID=${{ github.sha }} -t coast-pr-smoke .
      - name: Verify startup, independent evidence and shutdown
        run: |
          set -euo pipefail
          cleanup() {
            docker logs coast-pr-smoke || true
            docker rm -fv coast-lifecycle-test || true
            docker rm -fv coast-pr-smoke || true
          }
          trap cleanup EXIT
          docker run -d --name coast-lifecycle-test --entrypoint sleep coast-pr-smoke 600
          bun scripts/test-container-lifecycle.ts --docker coast-lifecycle-test
          bun scripts/test-container-runtime.ts --docker coast-lifecycle-test
          docker run -d --name coast-pr-smoke coast-pr-smoke
          for attempt in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' coast-pr-smoke)
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          test "$health" = healthy
          docker exec coast-pr-smoke bun -e '
            const read = name => Bun.file("/data/runtime/" + name + ".jsonl").text().then(text => text.trim().split("\n").map(JSON.parse));
            const migrations = await read("migrations"), database = await read("database-events");
            if (!migrations.some(row => row.kind === "migration.complete" && row.detail.appliedMigrationCount > 0 && row.detail.postgresVersion !== "unknown")) process.exit(1);
            if (!database.some(row => row.kind === "database.ready")) process.exit(1);
          '
          docker stop --time 30 coast-pr-smoke
          test "$(docker inspect --format '{{.State.OOMKilled}}' coast-pr-smoke)" = false
          docker cp coast-pr-smoke:/data/runtime/database-events.jsonl "$RUNNER_TEMP/database-events.jsonl"
          grep -q '"kind":"database.exit"' "$RUNNER_TEMP/database-events.jsonl"
          grep -q '"code":"shutdown-complete"' "$RUNNER_TEMP/database-events.jsonl"

  image:
    name: Build ${{ matrix.arch }} image
    needs: [verify, database]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native image by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          build-args: COAST_BUILD_ID=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Coast
            org.opencontainers.image.description=Self-hosted media tracker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Check container startup and health
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs coast-smoke || true
            docker rm -fv coast-smoke || true
          }
          trap cleanup EXIT
          docker run -d --name coast-smoke "$IMAGE"
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Status}}' coast-smoke)
            health=$(docker inspect --format '{{.State.Health.Status}}' coast-smoke)
            if [ "$health" = healthy ]; then
              exit 0
            fi
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          echo 'Container did not become healthy within two minutes.' >&2
          exit 1
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize tag updates without cancelling a running publish.
    concurrency:
      group: coast-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Check current preview revision
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview,enable=${{ steps.preview.outputs.current }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Assemble and verify image manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          digests=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            digests+=("$IMAGE@sha256:$digest")
          done
          [ "${#digests[@]}" -eq 2 ]
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          docker buildx imagetools inspect "${tags[0]}" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          printf 'Published native AMD64 and ARM64 images.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"
