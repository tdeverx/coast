name: Verify and publish preview

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: coast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run code:inventory
      - run: bun run ui:inventory:check
      - run: bun run check
      - run: bun test
      - run: bun run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:coast_test@localhost:5432/postgres
      - run: bun run build

  image:
    name: Build ${{ matrix.arch }} image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native image by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Coast
            org.opencontainers.image.description=Self-hosted media tracker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Check container startup and health
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs coast-smoke || true
            docker rm -fv coast-smoke || true
          }
          trap cleanup EXIT
          docker run -d --name coast-smoke "$IMAGE"
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Status}}' coast-smoke)
            health=$(docker inspect --format '{{.State.Health.Status}}' coast-smoke)
            if [ "$health" = healthy ]; then
              exit 0
            fi
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          echo 'Container did not become healthy within two minutes.' >&2
          exit 1
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize tag updates without cancelling a running publish.
    concurrency:
      group: coast-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Assemble and verify image manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          digests=()
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            digests+=("$IMAGE@sha256:$digest")
          done
          [ "${#digests[@]}" -eq 2 ]
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          docker buildx imagetools inspect "${tags[0]}" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          printf 'Published native AMD64 and ARM64 images.\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"
